[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["assets/logo-icon.png", "assets/vendor/jspdf/jspdf.umd.min.js"]

# littletechicalsolutions.com was added as a domain alias for brand
# protection, but Netlify's automatic "redirect non-primary domains to
# primary" behavior only covers www/apex variants of the SAME registered
# domain -- confirmed live in the Netlify dashboard: www.lit-solutions.tech
# shows "Redirects automatically to primary domain," but
# littletechicalsolutions.com and its www variant show only "Domain alias"
# with no such note, even with lit-solutions.tech set as primary. A
# genuinely different domain added as an alias just mirrors the site's
# content instead of forwarding. These explicit host-matched redirects are
# the fix. Must come before the generic /* catch-all below (redirects are
# evaluated in order, first match wins, and that rule has no hostname so it
# would otherwise match these requests first). `force = true` is required
# too -- without it, this domain's own served index.html/etc. would win
# over the redirect by Netlify's normal file-vs-redirect precedence.
[[redirects]]
  from = "https://littletechicalsolutions.com/*"
  to = "https://lit-solutions.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.littletechicalsolutions.com/*"
  to = "https://lit-solutions.tech/:splat"
  status = 301
  force = true

# Website plan tiers were renamed Basic/Standard/Pro -> Standard/Premium/
# Executive. Two of the three URLs changed; /plan-standard.html deliberately
# has NO redirect because the name was reused -- it now serves the entry tier
# rather than the middle one. The pages were only live for a day, so the
# index exposure is negligible.
[[redirects]]
  from = "/plan-basic.html"
  to = "/plan-standard.html"
  status = 301

[[redirects]]
  from = "/plan-pro.html"
  to = "/plan-executive.html"
  status = 301

[[redirects]]
  from = "/subscriptions.html"
  to = "/pricing.html#website-subscription"
  status = 301

# "Pay a Bill" is gone. Billing now lives where the rest of someone's
# paperwork does -- in their account -- rather than on a public page with an
# open-amount payment link anyone could load. Bookmarks and any inbound link
# land on the replacement.
[[redirects]]
  from = "/payment.html"
  to = "/myaccount.html#pay"
  status = 301

[[redirects]]
  from = "/payment"
  to = "/myaccount.html#pay"
  status = 301

# Focused campaign URLs stay extensionless and memorable while the static
# source remains one HTML file per page. These rewrites must precede the
# catch-all 404 below.
[[redirects]]
  from = "/home-tech-visit"
  to = "/home-tech-visit.html"
  status = 200

[[redirects]]
  from = "/local-business-websites"
  to = "/local-business-websites.html"
  status = 200

# Care Hub was retired in v4.9. Old bookmarks now enter the single account
# path. Force these redirects so stale built files cannot be served.
[[redirects]]
  from = "/care-hub"
  to = "/myaccount.html#signin"
  status = 301
  force = true

[[redirects]]
  from = "/care-hub/*"
  to = "/myaccount.html#signin"
  status = 301
  force = true

# This catch-all has no method restriction, so it also matches POST
# requests -- including a POST to "/" itself, which is how native Netlify
# Forms' AJAX pattern (fetch('/', {method:'POST', ...})) submits. That
# combination broke all 4 of the site's forms (contact/booking/newsletter/
# intake): every submission 404'd here instead of being captured by
# Netlify Forms. Fixed by moving those forms onto a real Netlify Function
# (netlify/functions/site-forms.js) instead -- /.netlify/functions/* is a
# reserved path Netlify always routes to the function first, regardless of
# this rule, matching how website-designer.js already worked. Do not
# reintroduce data-netlify="true" forms without re-solving this.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net; frame-src https://www.google.com; connect-src 'self' https://www.google.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net; form-action 'self'; base-uri 'self'; object-src 'none'"
